<g class="w2"><path d="M0,262 C150.0,246 450.0,278 600,262 C750.0,246 1050.0,278 1200,262 C1350.0,246 1650.0,278 1800,262 C1950.0,246 2250.0,278 2400,262 L2400,340 L0,340 Z" fill="#FFFFFF"/></g>
