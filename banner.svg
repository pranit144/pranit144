<text class="rot r0" x="72" y="206">I train models and build the apps around them</text><text class="rot r1" x="72" y="206">Computer vision · machine learning · MERN</text><text class="rot r2" x="72" y="206">CSE (AI &amp; ML) · VIT Pune · class of 2026</text><text class="rot r3" x="72" y="206">Open to ML engineer roles</text>
</g>
