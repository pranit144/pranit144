<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Pranit Chilbule, AI/ML engineer and full stack developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.name{font-family:Georgia,'Times New Roman',serif;font-size:64px;fill:#2B3A37;letter-spacing:-0.5px}
.sub{font-family:Georgia,'Times New Roman',serif;font-size:24px;fill:#4F7A74;font-style:italic}
.rot{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;fill:#2B3A37;opacity:0;animation:cycle 16s infinite}
.r0{animation-delay:0s}.r1{animation-delay:4s}.r2{animation-delay:8s}.r3{animation-delay:12s}
@keyframes cycle{0%{opacity:0;transform:translateY(6px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}
.w1{animation:drift 26s linear infinite}.w2{animation:drift 18s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-600px)}}
@media (prefers-reduced-motion:reduce){.w1,.w2,.rot{animation:none}.r0{opacity:1}}
</style>
<defs><clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath></defs>
<g clip-path="url(#card)">
<rect width="1200" height="320" fill="#CDD2CA"/>
