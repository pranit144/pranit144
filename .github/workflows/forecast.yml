name: Retrain forecast model

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python scripts/forecast.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # New query string on every run so GitHub's image cache fetches the fresh chart
          sed -i -E "s#assets/forecast\.svg(\?v=[0-9]+)?#assets/forecast.svg?v=$(date +%s)#" README.md
          git add assets/forecast.svg README.md
          git diff --cached --quiet || git commit -m "chore: retrain forecast"
          git pull --rebase
          git push
